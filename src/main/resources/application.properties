# Application Configuration
spring.application.name=MovieScope


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/MoviesDetails
spring.datasource.username=root
spring.datasource.password=Qwerty@123


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345
jwt.expiration=86400000

# TMDB API Configuration
tmdb.api.key=66ba0b8e9dff36277dda546985e03c18
tmdb.api.base-url=https://api.themoviedb.org/3

# Logging
logging.level.com.moviescope=DEBUG


# Encryption Configuration
encryption.secret.key=MySuperSecretKey1234567890ABCD

#SSL Configuration
server.port=443
server.ssl.key-store=C:/Users/LENOVO/Desktop/moviescope/keystore.p12
server.ssl.key-store-password=Qwerty@123
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat

# Cache Configuration
#spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-wait=3000
spring.data.redis.lettuce.pool.max-idle=10

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoints.web.exposure.exclude=shutdown
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Customize actuator path
management.endpoints.web.base-path=/actuator

# Health check details
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Use Hazelcast as cache
spring.cache.type=hazelcast

# Hazelcast instance name
hazelcast.instance.name=movie-hazelcast-instance

# Logging
logging.level.com.hazelcast=INFO
