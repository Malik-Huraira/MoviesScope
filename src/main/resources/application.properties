# Application Configuration
spring.application.name=MovieScope


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/MoviesDetails
spring.datasource.username=root
spring.datasource.password=Qwerty@123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345
jwt.expiration=86400000

# TMDB API Configuration
tmdb.api.key=66ba0b8e9dff36277dda546985e03c18
tmdb.api.base-url=https://api.themoviedb.org/3

# Logging
logging.level.com.moviescope=DEBUG


# Encryption Configuration
encryption.secret.key=MySuperSecretKey1234567890ABCD

#SSL Configuration
server.port=443
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=Qwerty@123
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat

# Cache Configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=6000
spring.data.redis.lettuce.pool.max-active=10
